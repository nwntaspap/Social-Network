version: '3.8'

services:
  forum:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forum-backend
    restart: unless-stopped
    ports:
      - "8080:8080"  # Backend API
    environment:
      # Server Configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_ENVIRONMENT: development
      SERVER_API_CONTEXT_V1: /api/v1
      SERVER_READ_TIMEOUT: 10
      SERVER_WRITE_TIMEOUT: 20
      SERVER_IDLE_TIMEOUT: 30
      SERVER_TLS_CERT_FILE: certs/localhost+2.pem
      SERVER_TLS_KEY_FILE: certs/localhost+2-key.pem
      
      # Database Configuration
      DB_DRIVER: sqlite3
      DB_PATH: db/data/forum.db
      DB_MIGRATE_ON_START: "true"
      DB_SEED_ON_START: "true"
      DB_PRAGMA: "_foreign_keys=on&_journal_mode=WAL"
      
      # Session Configuration
      SESSION_SECURE_COOKIE: "true"
      SESSION_COOKIE_SAME_SITE: Lax
      
      # Rate Limiting
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_WINDOW_SECONDS: 60

      # Message broker (eventbus) inside the compose network
      NOTIFICATIONS_BROKER_URL: broker:5672

      # OAuth (optional - add your credentials)
      GITHUB_CLIENT_ID: "{ INSERT HERE YOUR GITHUB CLIENT ID }"
      GITHUB_CLIENT_SECRET: "{ INSERT HERE YOUR GITHUB CLIENT SECRET }"
      GITHUB_REDIRECT_URL: https://localhost:8080/api/v1/auth/github/callback
      GITHUB_SCOPES: user,email
      FRONTEND_GITHUB_CALLBACK_URL: https://localhost:3001/auth/callback
      GOOGLE_CLIENT_ID: "{ INSERT HERE YOUR GOOGLE CLIENT ID }"
      GOOGLE_CLIENT_SECRET: "{ INSERT HERE YOUR GOOGLE CLIENT SECRET }"
      GOOGLE_REDIRECT_URL: https://localhost:8080/api/v1/auth/google/callback
      GOOGLE_SCOPES: https://www.googleapis.com/auth/userinfo.profile,https://www.googleapis.com/auth/userinfo.email
      GOOGLE_TOKEN_URL: https://oauth2.googleapis.com/token
      FRONTEND_GOOGLE_CALLBACK_URL: https://localhost:3001/auth/callback
    
    volumes:
      # Persistent database storage
      - forum-db:/app/db/data
      # Persistent user uploads
      - forum-uploads:/app/frontend/static/images/uploads
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    depends_on:
      broker:
        condition: service_started
    networks:
      - forum-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: forum-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"  # Next.js frontend
    environment:
      # Where the server-side proxy (rewrites) reaches the backend.
      # Uses the compose service name; certs below make its TLS trusted.
      BACKEND_ORIGIN: https://forum:8080
      # Where the server-side proxy reaches the notifications service.
      NOTIFICATIONS_ORIGIN: http://notifications:8081
      NODE_EXTRA_CA_CERTS: /app/certs/localhost+2.pem
      SESSION_SECURE_COOKIE: "true"
    volumes:
      # Trust the backend's self-signed certificate for the API proxy
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      forum:
        condition: service_started
    networks:
      - forum-network

  broker:
    image: danielkotsi/golangmq:latest
    ports:
      - "5672:5672"
    networks:
      - forum-network

  notifications:
    build:
      context: .
      dockerfile: Dockerfile.notifications
    container_name: forum-notifications
    restart: unless-stopped
    ports:
      - "8081:8081"  # Notifications API + SSE stream
    environment:
      # Where the service verifies session cookies against the backend.
      NOTIFICATIONS_BACKEND_URL: https://forum:8080/api/v1
      # Trust the backend's self-signed certificate (Go honours SSL_CERT_FILE).
      SSL_CERT_FILE: /app/certs/localhost+2.pem
      # Browser origin(s) allowed by CORS for direct calls.
      NOTIFICATIONS_ALLOWED_ORIGINS: http://localhost:3001,https://localhost:3001
      # Broker address inside the compose network.
      NOTIFICATIONS_BROKER_URL: broker:5672
      # SSE streams are long-lived — disable the write timeout.
      NOTIFICATIONS_WRITE_TIMEOUT: "0"
    volumes:
      - ./certs:/app/certs:ro
      - notifications-db:/app/db/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/v1/notifications/unread-count"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      forum:
        condition: service_started
      broker:
        condition: service_started
    networks:
      - forum-network

volumes:
  forum-db:
    driver: local
  forum-uploads:
    driver: local
  notifications-db:
    driver: local

networks:
  forum-network:
    driver: bridge
